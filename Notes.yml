import test from "@playwright/test";

import * as xslx from "xlsx";

const workBook=xslx.readFile("resources/userRole.xlsx");
// const workBook=xslx.readFile(require('path').join(__dirname, '../resources/userRole.xslx'));
const sheet=workBook.Sheets[workBook.SheetNames[0]];
const userRoles:any[]=xslx.utils.sheet_to_json(sheet);

for(let users of userRoles){

test(`CRM- user roles ${users.Test_Id}`, async({page})=>{

    await page.goto("https://apps.theauto-mate.com/crm/login.php");

    await page.getByRole("textbox",{name:"Username"}).fill(users.Username);

    await page.getByRole("textbox",{name:"Password"}).fill(users.Password);

    await page.getByRole("button",{name:"Sign In"}).click();

   
});
}

